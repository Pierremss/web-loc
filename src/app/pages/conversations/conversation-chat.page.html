<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Sala #{{ convId }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-page conversation-chat" fullscreen>
  <div class="layout-container chat-wrapper">
    <div class="chat-container surface-card">
      <div class="messages">
        <div *ngFor="let m of messages" class="message-row" [class.mine]="m.sender_id === auth.user?.id">
          <div class="avatar-col" *ngIf="m.sender_id !== auth.user?.id">
            <div class="avatar-fallback">{{ m.sender_name || ('#' + m.sender_id) }}</div>
          </div>
          <div class="bubble" [class.mine]="m.sender_id === auth.user?.id">
            <div class="header">
              <div class="meta-left">
                <span class="name">{{ m.sender_name || ('Jogador #' + m.sender_id) }}</span>
              </div>
              <div class="meta-right">
                <span class="time" *ngIf="m.__displayTime">{{ m.__displayTime }}</span>
                <span class="date" *ngIf="m.__displayDate">{{ m.__displayDate }}</span>
              </div>
            </div>
            <div class="text">{{ m.content }}</div>
          </div>
        </div>
      </div>
      <div class="typing" *ngIf="typingUsers.size">{{ typingUsers.size }} digitando…</div>
    </div>
  </div>
</ion-content>

<ion-footer class="chat-input">
  <ion-toolbar class="composer-toolbar">
    <div class="composer">
      <ion-input
        placeholder="Digite uma mensagem elegante"
        [(ngModel)]="content"
        (ionInput)="onTyping()"
        (keyup.enter)="send()"
        clearInput="true"
        enterkeyhint="send"
      ></ion-input>
      <ion-button class="send-btn" (click)="send()" [disabled]="!content.trim()" aria-label="Enviar mensagem">
        <ion-icon name="send"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
