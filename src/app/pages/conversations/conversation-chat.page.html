<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Sala #{{ convId }}</ion-title>
  </ion-toolbar>
  <ion-toolbar *ngIf="typingUsers.size">
    <ion-text color="medium" style="margin-left:12px">{{ typingUsers.size }} digitando…</ion-text>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let m of messages">
      <ion-label>
        <h3>#{{ m.id }} • {{ m.sender_id }}</h3>
        <ng-container *ngIf="isRoomMessage(m.content); else plain">
          <app-room-card [room]="parseRoom(m.content)"></app-room-card>
        </ng-container>
        <ng-template #plain>
          <p>{{ m.content }}</p>
        </ng-template>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer class="chat-input">
  <ion-toolbar>
    <ion-input placeholder="Mensagem" [(ngModel)]="content" (ionInput)="onTyping()"></ion-input>
    <ion-buttons slot="end">
      <ion-button (click)="send()">Enviar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
