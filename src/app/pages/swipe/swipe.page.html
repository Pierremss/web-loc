<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Voltar"></ion-back-button>
    </ion-buttons>
    <ion-title>Descobrir jogadores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handlePullRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      refreshingSpinner="crescent"
      pullingText="Puxe para atualizar"
      refreshingText="Buscando jogadores...">
    </ion-refresher-content>
  </ion-refresher>

  <ng-container *ngIf="items.length > 0; else fallback">
    <div class="deck">
    <div
      id="swipe-card"
      class="card"
      [style.transform]="'translate(' + dx + 'px,' + dy + 'px) rotate(' + angle + 'deg)'"
      [class.dragging]="dragging"
      (mousedown)="onDragStart($event)"
      (mousemove)="onDragMove($event)"
      (mouseup)="onDragEnd()"
      (mouseleave)="onDragEnd()"
      (touchstart)="onDragStart($event)"
      (touchmove)="onDragMove($event)"
      (touchend)="onDragEnd()">
  <img [src]="normalizeAvatar(top()?.avatar_url)" (error)="onImgError($event)" alt="avatar" />

  <div class="overlay like" [style.opacity]="Math.max(0, Math.min(1, dx/120))">LIKE</div>
  <div class="overlay pass" [style.opacity]="Math.max(0, Math.min(1, -dx/120))">PASS</div>

      <div class="gradient"></div>
      <div class="info">
        <h2>
          {{ top()?.name }}
          <small>{{ '@' + (top()?.nickname || '') }}</small>
        </h2>
        <p class="meta">{{ top()?.game_style }} • {{ top()?.platforms }}</p>
      </div>
    </div>

    <div class="fab-actions">
      <button class="btn pass" [disabled]="busy" (click)="onPass()">✕</button>
      <button class="btn like" [disabled]="busy" (click)="onLike()">❤</button>
    </div>
  </div>
  </ng-container>

  <ng-template #fallback>
    <ng-container *ngIf="loading; else emptyState">
      <ng-container *ngTemplateOutlet="skeleton"></ng-container>
    </ng-container>
  </ng-template>

  <ng-template #emptyState>
    <div class="empty-state">
      <div class="empty-card">
        <div class="icon-wrap">
          <ion-icon name="people-outline"></ion-icon>
        </div>
        <h2>Nenhum jogador encontrado</h2>
        <p>
          Assim que novos jogadores se cadastrarem eles aparecem por aqui.
          Atualize para ver se já temos alguém compatível com você.
        </p>
        <ion-button shape="round" color="primary" (click)="onRefresh()" [disabled]="loading">
          <ion-icon slot="start" name="refresh-outline"></ion-icon>
          Atualizar
          <ion-spinner slot="end" *ngIf="loading" name="dots"></ion-spinner>
        </ion-button>
      </div>
    </div>
  </ng-template>

  <ng-template #skeleton>
    <ion-list>
      <ion-item *ngFor="let i of [1,2,3,4,5]">
        <ion-thumbnail slot="start"><ion-skeleton-text animated style="width: 64px; height: 64px;"></ion-skeleton-text></ion-thumbnail>
        <ion-label>
          <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
        </ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-content>
