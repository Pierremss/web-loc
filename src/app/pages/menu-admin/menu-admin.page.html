<ion-content class="ion-padding menu-admin-page">
  <div class="admin-container">
    <h1 class="titulo">Menu Administrador</h1>
    <p class="subtitulo">Gerencie usuários e jogos</p>

    <div class="menu-opcoes">
      <ion-card class="opcao-card" routerLink="/users-list">
        <ion-card-header>
          <ion-icon name="people-outline" class="icone-opcao"></ion-icon>
          <ion-card-title>Gerenciar Usuários</ion-card-title>
          <ion-card-subtitle>Visualizar e editar usuários</ion-card-subtitle>
        </ion-card-header>
      </ion-card>

      <ion-card class="opcao-card" routerLink="/games-list">
        <ion-card-header>
          <ion-icon name="game-controller-outline" class="icone-opcao"></ion-icon>
          <ion-card-title>Gerenciar Jogos</ion-card-title>
          <ion-card-subtitle>Adicionar e editar jogos</ion-card-subtitle>
        </ion-card-header>
      </ion-card>

      <ion-card class="opcao-card" (click)="logout()">
        <ion-card-header>
          <ion-icon name="log-out-outline" class="icone-opcao"></ion-icon>
          <ion-card-title>Sair</ion-card-title>
          <ion-card-subtitle>Encerrar sessão</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    </div>
  </div>
</ion-content>
