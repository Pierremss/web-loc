<ion-app>
  <ion-menu *ngIf="showMenu" contentId="main-content" side="start" type="push">
    <ion-header class="menu-header">
      <ion-toolbar>
        <ion-title>WebLoc</ion-title>
        <ion-buttons slot="end" *ngIf="auth.isLogged() && !auth.isAdmin()">
          <ion-button class="menu-notifications" (click)="openNotifications()" aria-label="Notificações">
            <ion-icon name="notifications-outline"></ion-icon>
            <ion-badge
              *ngIf="totalNotifications > 0"
              class="menu-notifications__badge"
              color="danger"
            >{{ totalNotifications }}</ion-badge>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
      <div class="menu-profile" *ngIf="auth.isLogged()">
        <img [src]="normalizeAvatar(auth.user?.avatar_url)" (error)="onImgError($event)" alt="avatar" />
        <div class="info">
          <div class="name">{{ auth.user?.nickname || auth.user?.name }}</div>
          <div class="email">{{ auth.user?.email }}</div>
        </div>
      </div>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-list-header>Principal</ion-list-header>
        <ion-menu-toggle auto-hide="true" *ngFor="let p of appPages" >
          <ion-item *ngIf="p.show() && p.url" [routerLink]="p.url" routerDirection="root" lines="none">
            <span slot="start" class="menu-icon-wrapper">
              <ion-icon [name]="p.icon"></ion-icon>
            </span>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>

          <ion-item *ngIf="p.show() && !p.url" (click)="p.action?.()" button detail="false" lines="none">
            <span slot="start" class="menu-icon-wrapper">
              <ion-icon [name]="p.icon"></ion-icon>
            </span>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <ion-list *ngIf="auth.isLogged()">
        <ion-list-header>Conta</ion-list-header>
        <ion-item>
          <ion-icon slot="start" [name]="theme.isDark ? 'moon-outline' : 'sunny-outline'"></ion-icon>
          <ion-label>{{ theme.isDark ? 'Tema escuro' : 'Tema claro' }}</ion-label>
          <ion-toggle [checked]="theme.isDark" (ionChange)="theme.toggle()"></ion-toggle>
        </ion-item>
        <ion-menu-toggle auto-hide="true">
          <ion-item (click)="auth.logout(); pendingRequests = 0" lines="none">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Sair</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
