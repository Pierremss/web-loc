<ion-content class="ion-padding users-list-page">
  <div class="users-container">
    <div class="header">
      <div class="logo">
          <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Voltar"></ion-back-button>
    </ion-buttons>
        <h1>Gerenciar Usuários</h1>
        <p class="subtitulo">Administre os usuários do sistema</p>
      </div>
      <div class="actions">
      
      </div>
    </div>

    <div class="search-form">
      <ion-item>
        <ion-label position="floating">Pesquisar usuário</ion-label>
        <ion-input [(ngModel)]="searchTerm" (ionInput)="searchUsers()"></ion-input>
      </ion-item>
    </div>

    <ion-list class="users-list">
      <ion-item *ngFor="let u of filteredUsers" class="user-item">
        <ion-label>
          <h2>{{u.name}} <small *ngIf="u.is_admin">(admin)</small></h2>
          <p>{{u.email}}</p>
          <p *ngIf="u.created_at">Criado em: {{ u.created_at | date:'dd/MM/yyyy HH:mm' }}</p>
          <p *ngIf="!u.is_admin && isBanned(u)">Suspenso até: {{u.banned_until}}</p>
        </ion-label>

        <ion-button *ngIf="!u.is_admin && !isBanned(u)" color="warning" (click)="ban(u)">
          Banir
        </ion-button>
        <ion-button *ngIf="!u.is_admin && isBanned(u)" color="medium" (click)="unban(u)">
          Desbanir
        </ion-button>

        <ion-button color="danger" (click)="remove(u.id)" class="btn-remove">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Excluir
        </ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
