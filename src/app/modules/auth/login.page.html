<ion-content class="ion-padding login-page">
  <div class="login-wrapper layout-container">
    <div class="login-container surface-card stack-lg fadein">
      <div class="top-actions">
        <ion-button
          class="theme-toggle"
          fill="solid"
          size="small"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="themeToggleAria"
        >
          <ion-icon [name]="themeToggleIcon" slot="start"></ion-icon>
          {{ themeToggleText }}
        </ion-button>
      </div>

      <div class="logo">
        <ion-chip class="chip-soft">
          <ion-icon name="flash-outline"></ion-icon>
          <ion-label>Bem-vindo de volta</ion-label>
        </ion-chip>
        <h1 class="heading-highlight">WebLoc</h1>
        <p class="subtitle text-soft">Encontre jogadores como você</p>
      </div>

      <!-- Escolha do tipo de usuário -->
      <!-- <div class="tipo-login">
        <ion-segment [(ngModel)]="tipoUsuario" value="jogador" class="segmento-claro">
          <ion-segment-button value="jogador">
            Jogador
          </ion-segment-button>
          <ion-segment-button value="admin">
            Admin
          </ion-segment-button>
        </ion-segment>
      </div> -->

      <div class="button-group">
        <ion-button expand="block" class="grad pill" fill="solid" routerLink="/register">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Criar Conta
        </ion-button>
      </div>

      <div class="divider"><span>ou</span></div>

      <ion-item class="input-elevated">
        <ion-label position="floating">E-mail</ion-label>
        <ion-input type="email" [(ngModel)]="email" [disabled]="loading" required></ion-input>
      </ion-item>

      <ion-item class="input-elevated">
        <ion-label position="floating">Senha</ion-label>
        <ion-input type="password" [(ngModel)]="password" [disabled]="loading" required></ion-input>
      </ion-item>

      <div class="error-inline" *ngIf="error">{{ error }}</div>

      <div class="forgot-password">
        <a routerLink="/recuperarsenha">Esqueceu a senha?</a>
      </div>

      <ion-button class="grad pill" expand="block" (click)="submit()" [disabled]="loading">
        Entrar
        <ion-spinner *ngIf="loading" name="crescent" slot="end"></ion-spinner>
      </ion-button>
    </div>
  </div>
</ion-content>
